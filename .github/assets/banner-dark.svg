<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0914"/>
      <stop offset="50%" stop-color1="#120E24"/>
      <stop offset="100%" stop-color="#1A1333"/>
    </linearGradient>

    <!-- Lavender Gradient pour le Core -->
    <linearGradient id="marrow-core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="marrow-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave-dark-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="wave-dark-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5B21B6" stop-opacity="0.32"/>
    </linearGradient>

    <filter id="glow-lavender" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-dark)"/>

  <!-- Vagues fluides -->
  <g>
    <path d="M 0,210 C 320,150 520,330 820,200 C 1020,130 1120,220 1200,180 L 1200,400 L 0,400 Z" fill="url(#wave-dark-1)"/>
    <path d="M 0,270 C 260,330 460,210 760,280 C 960,330 1090,250 1200,270 L 1200,400 L 0,400 Z" fill="url(#wave-dark-2)"/>
  </g>

  <!-- Logo : La Matrice / Moelle Vivante (Organique & Dynamique) -->
  <g transform="translate(180, 100)">
    <!-- Aura Lavande -->
    <circle cx="100" cy="100" r="80" fill="#A78BFA" opacity="0.12" filter="url(#glow-lavender)"/>
    
    <!-- Enveloppe extérieure (Cellule / Matrice osseuse) -->
    <path d="M 100,20 C 145,20 175,45 175,90 C 175,145 135,180 100,180 C 60,180 25,145 25,90 C 25,45 55,20 100,20 Z" 
          fill="none" stroke="url(#marrow-ring-grad)" stroke-width="4" stroke-dasharray="180 10 90 10"/>

    <!-- Goutte / Noyau de Moelle (Marrow Core) -->
    <path d="M 100,45 C 130,45 150,70 150,105 C 150,140 125,155 100,155 C 75,155 50,140 50,105 C 50,70 70,45 100,45 Z" 
          fill="url(#marrow-core-grad)"/>

    <!-- Point de création / Étincelle centrale -->
    <circle cx="100" cy="95" r="16" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="100" cy="95" r="8" fill="#C4B5FD"/>
  </g>

  <!-- Typography -->
  <g transform="translate(440, 175)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="72" fill="#F5F3FF" letter-spacing="2">
      MARROW
    </text>
    
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#C4B5FD" opacity="0.9" letter-spacing="1">
      A fast, self-hosted, systems programming language
    </text>

    <!-- Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#2E1065"/>
      <text x="60" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#DDD6FE" text-anchor="middle">QBE BACKEND</text>

      <rect x="132" y="0" width="120" height="28" rx="6" fill="#3B0764"/>
      <text x="192" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#E9D5FF" text-anchor="middle">SELF-HOSTED</text>

      <rect x="264" y="0" width="110" height="28" rx="6" fill="#1A1333" stroke="#8B5CF6" stroke-width="1"/>
      <text x="319" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#C4B5FD" text-anchor="middle">FREESTANDING</text>
    </g>
  </g>
</svg>
