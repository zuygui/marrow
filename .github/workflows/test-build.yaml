name: Test Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Installer Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Install QBE
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          git clone git://c9x.me/qbe.git /tmp/qbe
          cd /tmp/qbe
          make
          sudo make install

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Build & Test Standard Library
        run: cargo run -- std/std.mw

  compiler-portability:
    name: Compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The type checker and the diagnostics do not need QBE or a C compiler,
      # so they can be tested on every platform.
      - name: Build
        run: cargo build --all-targets

      - name: Diagnostics tests
        run: cargo test

      - name: Type-check the standard library
        run: cargo run -- --check std/std.mw
