name: Test Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Compiler + end-to-end tests on real hardware: every tests/run/*.mw is
  # compiled with --nostdlib, executed and compared with its .stdout file.
  native:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux x86_64", os: ubuntu-latest }
          - { name: "linux aarch64", os: ubuntu-24.04-arm }
          - { name: "macos aarch64", os: macos-latest }
          - { name: "macos x86_64", os: macos-13 }

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build and install QBE
        run: |
          sh .github/scripts/fetch-qbe.sh /tmp/qbe
          QBE_INSTALL=sudo sh .github/scripts/build-qbe.sh /tmp/qbe

      - run: cargo build --all-targets
      - name: Tests (diagnostics + end-to-end programs)
        run: cargo test
      - name: Compile the standard library
        run: cargo run -- std/std.mw

  # The Windows platform layer is experimental: it is built and the programs
  # are run, but a failure here does not block the other jobs yet.
  windows:
    name: Native (windows x86_64)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-rust
      - name: Build and install QBE
        run: |
          sh .github/scripts/fetch-qbe.sh /tmp/qbe
          sh .github/scripts/build-qbe.sh /tmp/qbe CC=gcc
          cp /tmp/qbe/qbe.exe /mingw64/bin/qbe.exe
      - run: cargo build --all-targets
      - name: cargo test
        run: |
          cargo test >/tmp/test.out 2>&1 || {
            tail -n 60 /tmp/test.out
            echo "::error::cargo test failed: $(grep -E 'panicked|FAILED|failed|error' /tmp/test.out | head -n 12 | tr '\n' '|' | cut -c1-900)"
            exit 1
          }
      - run: cargo run -- std/std.mw

  # Programs for architectures the CI runners do not have are built for
  # freestanding Linux and run under qemu-user.
  cross-qemu:
    name: Emulated (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux, triple: aarch64-linux-gnu, qemu: qemu-aarch64 }
          - { target: riscv64-linux, triple: riscv64-linux-gnu, qemu: qemu-riscv64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-user build-essential
          sh .github/scripts/fetch-qbe.sh /tmp/qbe
          QBE_INSTALL=sudo sh .github/scripts/build-qbe.sh /tmp/qbe
      - run: cargo build
      - name: Run the end-to-end programs under qemu
        run: tests/cross.sh ${{ matrix.target }} ${{ matrix.triple }} ${{ matrix.qemu }}

  # Every target must at least assemble; macOS and Windows objects cannot be
  # executed here, so this is the check that their output stays well-formed.
  assemble:
    name: Assemble (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          sh .github/scripts/fetch-qbe.sh /tmp/qbe
          QBE_INSTALL=sudo sh .github/scripts/build-qbe.sh /tmp/qbe
      - run: cargo build
      - name: Assemble tests/run/task_net.mw for every target
        run: |
          mkdir -p /tmp/asm && cp -r std /tmp/asm/std
          cp tests/run/task_net.mw /tmp/asm/t.mw
          cd /tmp/asm
          for pair in x86_64-linux:x86_64-linux-gnu aarch64-linux:aarch64-linux-gnu riscv64-linux:riscv64-linux-gnu \
                      x86_64-macos:x86_64-apple-macos aarch64-macos:aarch64-apple-macos x86_64-windows:x86_64-pc-windows-gnu; do
            target=${pair%%:*}; triple=${pair##*:}
            echo "== $target"
            $GITHUB_WORKSPACE/target/debug/marrow --target $target t.mw
            clang --target=$triple -c t.s -o t_$target.o
          done

  type-check:
    name: Type-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo run -- --check std/std.mw
