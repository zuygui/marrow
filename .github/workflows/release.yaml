name: Release Marrow

on:
  push:
    tags:
      - 'v*' # S'exécute uniquement quand tu pushes un tag (ex: v0.1.0)

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: marrow-x86_64-unknown-linux-gnu.tar.gz
            use_zip: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_name: marrow-aarch64-unknown-linux-gnu.tar.gz
            use_zip: false

          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: marrow-aarch64-apple-darwin.tar.gz
            use_zip: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: marrow-x86_64-pc-windows-msvc.zip
            use_zip: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Si ton compilateur est écrit en Rust (ajuste si c'est en C/C++)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      # 📦 Préparation du dossier de release (Binaire + Stdlib)
      - name: Package Release Assets (Unix)
        if: ${{ !matrix.use_zip }}
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/marrow dist/
          cp -r std dist/
          cd dist
          tar -czvf ../${{ matrix.archive_name }} marrow std

      - name: Package Release Assets (Windows)
        if: ${{ matrix.use_zip }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/${{ matrix.target }}/release/marrow.exe dist/
          Copy-Item -Recurse std dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive_name }}

      # 🚀 Upload de l'archive dans la Release GitHub
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}