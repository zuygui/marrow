name: Release Marrow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: marrow-x86_64-unknown-linux-gnu.tar.gz
            use_zip: false

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_name: marrow-aarch64-unknown-linux-gnu.tar.gz
            use_zip: false

          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_name: marrow-x86_64-apple-darwin.tar.gz
            use_zip: false

          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: marrow-aarch64-apple-darwin.tar.gz
            use_zip: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: marrow-x86_64-pc-windows-msvc.zip
            use_zip: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Install QBE (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          sh "$GITHUB_WORKSPACE/.github/scripts/fetch-qbe.sh" /tmp/qbe
          cd /tmp/qbe
          make
          mkdir -p $GITHUB_WORKSPACE/qbe_bin
          cp qbe $GITHUB_WORKSPACE/qbe_bin/qbe   # <-- Correction ici ! (qbe au lieu de obj/qbe)

      - name: Build and Install QBE (macOS)
        if: runner.os == 'macOS'
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/fetch-qbe.sh" /tmp/qbe
          cd /tmp/qbe
          make
          mkdir -p $GITHUB_WORKSPACE/qbe_bin
          cp qbe $GITHUB_WORKSPACE/qbe_bin/qbe   # <-- Correction ici !

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git make diffutils
            mingw-w64-x86_64-gcc
          cache: true

      - name: Build and Install QBE (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/fetch-qbe.sh" /tmp/qbe
          cd /tmp/qbe
          make CC=gcc
          mkdir -p $GITHUB_WORKSPACE/qbe_bin
          cp qbe.exe $GITHUB_WORKSPACE/qbe_bin/qbe.exe   # <-- Correction ici !

      - name: Build Marrow binary (Unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="$GITHUB_WORKSPACE/qbe_bin:$PATH"
          ./bootstrap.sh

      - name: Build Marrow binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$GITHUB_WORKSPACE")/qbe_bin:$PATH"
          ./bootstrap.sh

      - name: Package Release Assets (Unix)
        if: ${{ !matrix.use_zip }}
        run: |
          mkdir -p dist
          cp build/marrow dist/
          cp qbe_bin/qbe dist/
          cp -r std dist/
          cd dist
          tar -czvf ../${{ matrix.archive_name }} marrow qbe std

      - name: Package Release Assets (Windows)
        if: ${{ matrix.use_zip }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build/marrow.exe dist/
          Copy-Item qbe_bin\qbe.exe dist/
          Copy-Item -Recurse std dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}