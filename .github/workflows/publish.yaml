name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ docs ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # The playground runs the real compiler in WebAssembly: rebuild it from the compiler's main branch
      # so it never drifts. Skipped (the committed build is kept) until tools/wasm exists on main.
      - name: Check out the Marrow compiler
        uses: actions/checkout@v7
        with:
          repository: zuygui/marrow
          ref: main
          path: marrow-src
      - name: Build the playground compiler (WebAssembly)
        run: |
          if [ -f marrow-src/tools/wasm/build.mjs ]; then
            sh marrow-src/.github/scripts/fetch-qbe.sh /tmp/qbe
            QBE_INSTALL=sudo sh marrow-src/.github/scripts/build-qbe.sh /tmp/qbe
            (cd marrow-src && ./bootstrap.sh)
            node marrow-src/tools/wasm/build.mjs marrow-src/build/marrow public/playground
          else
            echo "tools/wasm not on main yet: keeping the committed playground build"
          fi
          rm -rf marrow-src
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
          # build-cmd: pnpm run build # The command to run to build your site. Runs the package build script/task by default. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5