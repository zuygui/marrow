name: Build the index

# index.json is what the website (and a quick `marrow search`) reads. It is rebuilt whenever a
# package entry changes, and committed back to this branch.
on:
  push:
    branches: [registry]
    paths:
      - "packages/**"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index.json
        run: python3 scripts/build_index.py
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json is up to date"
          else
            git commit -m "chore: rebuild index.json"
            git push
          fi
